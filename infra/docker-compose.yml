# Reagentic Banking Agent — local compose (7 JVMs + Kafka + Postgres)
# Builds each service from source via infra/Dockerfile (MODULE arg) and wires
# them together. The frontend is NOT containerized (run on host, see README).
#
# Usage:
#   cp infra/.env.example infra/.env   # edit JWT_SECRET
#   docker compose up --build
#
# For <=16 GB hosts use the reduced-heap overlay:
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up --build

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.7.1
    # Local-demo only: the image runs as appuser(1000) but named volumes are
    # root-owned, so the broker cannot format its log dir. Run as root so it
    # can own /tmp/kafka-logs and persist topics across restarts.
    user: '0:0'
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      # Single-broker KRaft: internal topics need RF=1 or they can never be
      # created (defaults RF=3), permanently breaking consumer-group coordination.
      KAFKA_DEFAULT_REPLICATION_FACTOR: '1'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      CLUSTER_ID: 'v5CPpn1hRgOnvjuqzHfYwA'
      KAFKA_LOG_DIRS: '/tmp/kafka-logs'
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    volumes:
      - kafka-data:/tmp/kafka-logs

  auth-service:
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        MODULE: auth-service
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      AUTH_DB_URL: ${AUTH_DB_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  account-service:
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        MODULE: account-service
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      ACCOUNT_DB_URL: ${ACCOUNT_DB_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  payment-service:
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        MODULE: payment-service
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      PAYMENT_DB_URL: ${PAYMENT_DB_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      ACCOUNT_SERVICE_URL: ${ACCOUNT_SERVICE_URL}
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      account-service:
        condition: service_healthy

  ledger-service:
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        MODULE: ledger-service
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      LEDGER_DB_URL: ${LEDGER_DB_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      ACCOUNT_SERVICE_URL: ${ACCOUNT_SERVICE_URL}
      LEDGER_FAULT_SKIP_APPEND: ${LEDGER_FAULT_SKIP_APPEND:-false}
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      account-service:
        condition: service_healthy

  notification-service:
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        MODULE: notification-service
    environment:
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      NOTIFICATION_DB_URL: ${NOTIFICATION_DB_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  ai-agent:
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8086/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        MODULE: ai-agent
    environment:
      JWT_SECRET: ${JWT_SECRET}
      ACCOUNT_SERVICE_URL: ${ACCOUNT_SERVICE_URL}
      LEDGER_SERVICE_URL: ${LEDGER_SERVICE_URL}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-gemini}
      SPRING_AI_OLLAMA_BASE_URL: ${SPRING_AI_OLLAMA_BASE_URL}
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    env_file:
      - .env
    depends_on:
      account-service:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    ports:
      - "8086:8086"

  transaction-service:
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8087/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        MODULE: transaction-service
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      TRANSACTION_DB_URL: ${TRANSACTION_DB_URL:-jdbc:postgresql://postgres:5432/transaction_db}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  gateway:
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        MODULE: gateway
    environment:
      JWT_SECRET: ${JWT_SECRET}
      VITE_GATEWAY_URL: ${VITE_GATEWAY_URL}
      GATEWAY_CORS_ORIGINS: ${GATEWAY_CORS_ORIGINS:-http://localhost:*}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      ACCOUNT_SERVICE_URL: ${ACCOUNT_SERVICE_URL}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL}
      LEDGER_SERVICE_URL: ${LEDGER_SERVICE_URL}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      AI_AGENT_URL: ${AI_AGENT_URL}
      TRANSACTION_SERVICE_URL: ${TRANSACTION_SERVICE_URL:-http://transaction-service:8087}
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      ai-agent:
        condition: service_healthy
      transaction-service:
        condition: service_healthy

volumes:
  pg-data:
  kafka-data:
