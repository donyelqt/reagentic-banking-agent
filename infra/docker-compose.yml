# Reagentic Banking Agent — local compose (7 JVMs + Kafka + Postgres)
# Builds each service from source via infra/Dockerfile (MODULE arg) and wires
# them together. The frontend is NOT containerized (run on host, see README).
#
# Usage:
#   cp infra/.env.example infra/.env   # edit JWT_SECRET
#   docker compose up --build
#
# For <=16 GB hosts use the reduced-heap overlay:
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up --build

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  auth-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        MODULE: auth-service
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      AUTH_DB_URL: ${AUTH_DB_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  account-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        MODULE: account-service
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      ACCOUNT_DB_URL: ${ACCOUNT_DB_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  payment-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        MODULE: payment-service
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      PAYMENT_DB_URL: ${PAYMENT_DB_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      ACCOUNT_SERVICE_URL: ${ACCOUNT_SERVICE_URL}
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      account-service:
        condition: service_started

  ledger-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        MODULE: ledger-service
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      LEDGER_DB_URL: ${LEDGER_DB_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        MODULE: notification-service
    environment:
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      NOTIFICATION_DB_URL: ${NOTIFICATION_DB_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  ai-agent:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        MODULE: ai-agent
    environment:
      JWT_SECRET: ${JWT_SECRET}
      ACCOUNT_SERVICE_URL: ${ACCOUNT_SERVICE_URL}
      LEDGER_SERVICE_URL: ${LEDGER_SERVICE_URL}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL}
      SPRING_AI_OLLAMA_BASE_URL: ${SPRING_AI_OLLAMA_BASE_URL}
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    depends_on:
      account-service:
        condition: service_started
      ledger-service:
        condition: service_started
      payment-service:
        condition: service_started
    ports:
      - "8086:8086"

  gateway:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        MODULE: gateway
    environment:
      JWT_SECRET: ${JWT_SECRET}
      VITE_GATEWAY_URL: ${VITE_GATEWAY_URL}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      ACCOUNT_SERVICE_URL: ${ACCOUNT_SERVICE_URL}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL}
      LEDGER_SERVICE_URL: ${LEDGER_SERVICE_URL}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      AI_AGENT_URL: ${AI_AGENT_URL}
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - account-service
      - payment-service
      - ledger-service
      - notification-service
      - ai-agent

volumes:
  pg-data:
  kafka-data:
